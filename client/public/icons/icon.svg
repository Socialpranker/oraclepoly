<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0F13"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ring)" stroke-width="12" opacity="0.3"/>
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.15"/>
  <!-- Oracle eye shape -->
  <path d="M116 256 C116 256 186 176 256 176 C326 176 396 256 396 256 C396 256 326 336 256 336 C186 336 116 256 116 256 Z" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linejoin="round"/>
  <!-- Iris -->
  <circle cx="256" cy="256" r="52" fill="url(#eye)" opacity="0.9"/>
  <!-- Pupil -->
  <circle cx="256" cy="256" r="22" fill="#0A0A0B"/>
  <!-- Light reflection -->
  <circle cx="244" cy="244" r="8" fill="white" opacity="0.7"/>
  <!-- Bottom text -->
  <text x="256" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" letter-spacing="8" fill="white" opacity="0.9">ORACLE</text>
</svg>
