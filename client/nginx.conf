server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP:
    #  - 'unsafe-eval' нужен telegram-web-app.js (window.__parseFunction)
    #  - 'unsafe-inline' для script-src убран — inline блок вынесен в /init-tma.js
    #  - 'unsafe-inline' в style-src оставлен (Tailwind/CSS-in-JS injects styles)
    #  - object-src 'none', base-uri 'self', form-action 'self' — defence-in-depth
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https://telegram.org; connect-src 'self' https://example.com wss://example.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://oauth.telegram.org; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Cache static assets (hashed filenames — safe to cache forever).
    # ВАЖНО: этот location идёт ПЕРЕД "/", иначе SPA fallback перехватывает.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback. index.html НЕ кэшируем — иначе после deploy
    # клиент держит старый указатель на удалённые assets/*.js.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
