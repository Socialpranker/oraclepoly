services:
  postgres:
    image: postgres:16-alpine
    container_name: oraclepoly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oraclepoly
      POSTGRES_USER: oraclepoly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
      - ./migrations:/docker-entrypoint-initdb.d/migrations:ro
    shm_size: 768mb
    command: >
      postgres
        -c shared_buffers=1GB
        -c effective_cache_size=3GB
        -c work_mem=16MB
        -c maintenance_work_mem=256MB
        -c max_connections=100
        -c shared_preload_libraries=pg_stat_statements
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
        -c autovacuum_max_workers=2
        -c autovacuum_vacuum_scale_factor=0.05
        -c autovacuum_analyze_scale_factor=0.02
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oraclepoly -d oraclepoly"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    container_name: oraclepoly-redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD env var must be set}" --maxmemory 100mb --maxmemory-policy volatile-lru
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - backend_net

  backend:
    build: .
    container_name: oraclepoly-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Переопределяем URL-ы для Docker bridge network (вместо localhost)
      DATABASE_URL: postgresql://oraclepoly:${POSTGRES_PASSWORD}@postgres:5432/oraclepoly
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips", "*"]
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2500M
        reservations:
          memory: 500M
    volumes:
      - ./logs:/app/logs
      - ./research/data:/app/research/data
      - /mnt/data/polymarket_dataset:/mnt/data/polymarket_dataset:ro
      # Canonical layer (derived from HF parquet, 1.5 GB, 10 tables).
      # Used by ML re-fit jobs (ml-calibrator-fit, ml-honest-baseline-fit), backtest
      # framework, и detector audit. Без mount jobs не видят canonical layer
      # (memory врала про "canonical NOT built" — фактически build на старом VPS
      # пережил migration через rsync 2026-05-11).
      - /mnt/data/canonical:/mnt/data/canonical:ro
      # Persistent research output (negrisk scanner JSONL, v2 snapshots).
      # Без этого mount /tmp в контейнере эфемерный → данные теряются на restart.
      - ./research/output:/app/research/output
      # Portfolio Analyst Agent owner's report (Phase 0 Task 10, monthly markdown).
      # Без этого mount agent_owners_report.py падает — /app/research/<subdir>
      # не существует в образе (research/ исключён из git-tracked build context
      # кроме явно смонтированных путей), mkdir на невидимом родителе недоступен
      # непривилегированному uid 999. Обнаружено первым реальным прогоном на проде
      # 2026-07-20.
      - ./research/agent-owners-report:/app/research/agent-owners-report
      # Migrations bind-mount (read-only). `migrations/` исключён из Docker image
      # через .dockerignore (security: SQL не попадает в registry/image). Без этого
      # mount `docker exec backend python scripts/run_migration.py` падает с
      # `Migrations directory not found: /app/migrations`. См. инцидент 2026-05-22.
      - ./migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend_net

  worker:
    build: .
    container_name: oraclepoly-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://oraclepoly:${POSTGRES_PASSWORD}@postgres:5432/oraclepoly
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    command: ["python", "scripts/oracle_worker.py"]
    networks:
      - backend_net

  # Phase 1 Stage 5: heart-beat dead-man daemon
  # См. docs/superpowers/plans/2026-05-risk-engine-hardening/05-risk-daemon-deadman.md
  risk-daemon:
    build: .
    container_name: oraclepoly-risk-daemon
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://oraclepoly:${POSTGRES_PASSWORD}@postgres:5432/oraclepoly
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    command: ["python", "scripts/risk_daemon.py", "--loop"]
    healthcheck:
      test: ["CMD", "python", "scripts/risk_daemon.py", "--check-once"]
      interval: 60s
      timeout: 30s
      retries: 3
    networks:
      - backend_net

  # Phase 3 Task 3 (audit топ-7): резидентный execution-демон на Redis-очереди.
  # См. docs/superpowers/plans/2026-07-02-audit-fixes-phase3.md.
  # EXECUTION_DAEMON_ENABLED=false по умолчанию — процесс запускается всегда
  # (нужен для гейта готовности), но главный цикл не исполняет сигналы, пока
  # флаг не поднят вручную после ramp-гейта.
  execution-daemon:
    build: .
    container_name: oraclepoly-execution-daemon
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://oraclepoly:${POSTGRES_PASSWORD}@postgres:5432/oraclepoly
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    command: ["python", "scripts/execution_daemon.py", "--loop"]
    healthcheck:
      test: ["CMD", "python", "scripts/execution_daemon.py", "--check-once"]
      interval: 60s
      timeout: 30s
      retries: 3
    networks:
      - backend_net

  frontend:
    build:
      context: ./client
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME:-}
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-}
    container_name: oraclepoly-frontend
    ports:
      - "127.0.0.1:3000:80"
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge
    enable_ipv6: true

volumes:
  pgdata:
