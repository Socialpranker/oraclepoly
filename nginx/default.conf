# ===========================================
# OraclePoly Nginx Configuration (HTTPS + SSL)
# ===========================================

# Редирект HTTP → HTTPS
server {
    listen 80;
    server_name example.com;

    # Let's Encrypt challenge (нужен для обновления сертификатов)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все остальные запросы → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    server_name example.com;

    # --- SSL сертификаты (Let's Encrypt) ---
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # --- SSL оптимизация ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Лимит размера body (защита от large payload attacks)
    client_max_body_size 2m;

    # --- Логи ---
    access_log /var/log/nginx/oraclepoly_access.log;
    error_log /var/log/nginx/oraclepoly_error.log;

    # --- WebSocket ---
    location /api/ws {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # --- Backend API ---
    location /api {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для долгих AI-запросов
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # API не должен рендериться в iframe
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # --- Telegram Webhook (выделенный location для быстрого прокси) ---
    location /api/telegram/webhook {
        proxy_pass http://localhost:8000/api/telegram/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Telegram отправляет JSON body
        proxy_set_header Content-Type application/json;
    }

    # --- Health Check ---
    location /health {
        proxy_pass http://localhost:8000/health;
    }

    # --- Frontend (собранный Vite build) ---
    location / {
        root /root/oracle/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # HTML — никогда не кэшировать (Telegram WebView агрессивно кэширует)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # CSP для Telegram Mini App (разрешаем iframe в t.me и web.telegram.org)
        # 'unsafe-eval' нужен для telegram-widget.js — он использует window.__parseFunction (eval) для инициализации виджета
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://telegram.org; connect-src 'self' wss://example.com ws://example.com https://*.sentry.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; frame-src https://oauth.telegram.org; frame-ancestors https://t.me https://web.telegram.org;" always;

        # Кэширование статики (JS/CSS имеют хэши в именах — безопасно кэшировать)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            root /root/oracle/client/dist;
            expires 30d;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
