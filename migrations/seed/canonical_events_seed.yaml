# Canonical events seed — top cross-venue events для PolyOracle multi-venue (PDF §14.b).
#
# Manual mapping для Phase 1. Phase 2: auto-match через embeddings + LLM
# extraction из markets table.
#
# Структура:
#   events:
#     - slug: <url-safe-id>
#       title: <human-readable>
#       category: politics|sports|economics|crypto|macro
#       description: <context>
#       resolution_criterion: <formal>
#       resolution_source: <where to look>
#       expected_resolves_at: <ISO timestamp, optional>
#       venues:
#         - venue: polymarket|kalshi|manifold|betfair|smarkets|limitless|drift_predict
#           market_id: <venue-specific id>
#           url: <direct link, optional>
#           side: direct|inverse  (default direct)
#
# Это шаблон. market_id'ы будут заполнены после reconnect Kalshi credentials
# (тогда matcher Phase 1.1 авто-обогатит). Для Phase 1 manual seed для
# development + integration test.
#
# Status note: market_id поля = placeholders для большинства events.
# Реальные id обновятся через update_canonical_mapping.py когда venue API
# available.

events:
  # ─── ECONOMICS / MACRO ─────────────────────────────────────────────
  - slug: fed-march-2026-rate-decision
    title: Fed March 2026 FOMC rate decision
    category: economics
    description: |
      March 18-19 2026 FOMC meeting outcome. Cross-venue marquee event —
      Polymarket активен, Kalshi institutional flow, oft Manifold для
      retail sentiment baseline.
    resolution_criterion: effective federal funds rate target range change
    resolution_source: Federal Reserve press release post-FOMC
    expected_resolves_at: 2026-03-19T19:00:00Z
    venues:
      - venue: polymarket
        market_id: "fed-march-2026-rate-decision"
        side: direct
      - venue: kalshi
