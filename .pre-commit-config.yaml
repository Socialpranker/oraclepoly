repos:
  # Branch protection: блокируем прямые коммиты в main.
  # Инцидент 2026-05-26: docs commit f063888b ушёл прямо в main, потому что хук
  # был задекларирован в CLAUDE.md, но не настроен. См. CLAUDE.md "Code Style".
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]

  # Ruff: fast Python linter + formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^app/
      - id: ruff-format
        files: ^app/

  # Vulture: dead code detection
  - repo: local
    hooks:
      - id: vulture
        name: vulture (dead code)
        entry: python -m vulture
        args: [app/, scripts/vulture_whitelist.py, --min-confidence, "80"]
        language: python
        additional_dependencies: ["vulture>=2.14"]
        files: ^app/
        pass_filenames: false

  # ESLint: frontend lint.
  # language: system — берём eslint из client/node_modules через relative path,
  # не качаем из npm registry (иначе при флапе registry pre-commit падает).
  # Файлы передаются от repo-root, config лежит в client/, eslint должен
  # бежать с cwd=client/ — отсюда `-c client/eslint.config.js`.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: client/node_modules/.bin/eslint -c client/eslint.config.js
        language: system
        files: ^client/src/.*\.(ts|tsx)$

  # Polymarket fees sanity — никогда не set fee=0 в backtest scripts.
  # Polymarket НЕ бесплатен (per-category dynamic 1.00-1.80%).
  # См. memory feedback_polymarket_fees_critical.md.
  - repo: local
    hooks:
      - id: no-zero-fees
        name: no DEFAULT_FEE_PCT = 0
        entry: bash -c 'if grep -rE "^\s*(DEFAULT_)?FEE_PCT\s*=\s*0\.0[^a-zA-Z]" scripts/ app/ 2>/dev/null; then echo "❌ DEFAULT_FEE_PCT = 0 forbidden — Polymarket charges per-category fees, см. feedback_polymarket_fees_critical.md"; exit 1; fi'
        language: system
        files: \.py$
        pass_filenames: false

  # Единый конверт уведомлений, Acceptance §9: джоба отдаёт структуру шине,
  # а не форматирует HTML и не шлёт в TG сама. Белый список — в самом скрипте,
  # он сокращается по мере миграции очереди 2.
  - repo: local
    hooks:
      - id: jobs-use-notification-bus
        name: джоба не шлёт в TG напрямую
        # python3, не python: голого `python` в окружении нет (только внутри venv).
        entry: python3 scripts/check_jobs_use_notification_bus.py
        language: system
        files: ^app/jobs/.*\.py$
        pass_filenames: false
