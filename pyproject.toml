[project]
name = "oracle"
version = "0.1.0"
description = "High-tech predictive hub for Polymarket"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "asyncpg>=0.29.0",
    "boto3>=1.34.0",
    "qdrant-client>=1.7.0",
    "openai>=1.10.0",
    "uvloop>=0.19.0",
    "async-lru>=2.0.4",
    "py-clob-client-v2>=1.0.0",
    "slowapi>=0.1.9",
    # Phase 2: Reliability
    "pybreaker>=1.0.1",       # Circuit Breaker pattern
    "tenacity>=8.2.0",        # Retry logic with exponential backoff
    "structlog>=24.1.0",      # Structured logging
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
    "vulture>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# F401 = unused imports, I = isort, UP = pyupgrade
ignore = ["E501"]
per-file-ignores = {"app/main.py" = ["E402"], "app/agents/black_swan.py" = ["E402"]}

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.vulture]
min_confidence = 80
paths = ["app/"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
